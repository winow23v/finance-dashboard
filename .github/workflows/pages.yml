name: GitHub Pages
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional full commit SHA to require for this publication
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify publication commit
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ -n $EXPECTED_SHA && $EXPECTED_SHA != "$GITHUB_SHA" ]]; then
            echo 'The selected branch has advanced since the release commit.' >&2
            exit 1
          fi
          printf 'Pages candidate commit `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vps-api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix vps-api
      - run: npm test
      - run: npm run typecheck
      - id: pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Check public Google sign-in configuration
        if: github.event_name == 'workflow_dispatch'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e '
            const url = new URL(process.env.VITE_SUPABASE_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash ||
                !process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.startsWith("sb_publishable_")) {
              throw new Error("Configure the Supabase project URL and its publishable key in repository variables");
            }
          '
      - run: npm run build
        env:
          VITE_DATA_MODE: api
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: https://winow.duckdns.org
          PAGES_BASE_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/', steps.pages.outputs.base_path) || '/finance-dashboard/' }}
      - name: Audit static build
        run: python3 .github/scripts/pages-audit.py --dist dist
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  audit-deployment:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: pages-artifact
      - name: Verify the deployed build
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir audited-pages
          tar -xf pages-artifact/artifact.tar -C audited-pages
          for attempt in 1 2 3 4 5; do
            if python3 .github/scripts/pages-audit.py --dist audited-pages --url "${PAGES_URL%/}/"; then
              exit 0
            fi
            if [[ $attempt -lt 5 ]]; then sleep 15; fi
          done
          exit 1
