name: Oracle VPS API
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Package the collector, validate Oracle, deploy changes, or restart with the current environment
        type: choice
        options:
          - package
          - validate
          - deploy
          - redeploy
        default: validate
        required: true
      expected_sha:
        description: Optional full commit SHA to require for this run
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: oracle-vps-api
  cancel-in-progress: false

jobs:
  collector-package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Package and verify the collector from the workflow commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [[ -n $EXPECTED_SHA && $EXPECTED_SHA != "$GITHUB_SHA" ]]; then
            echo 'main has advanced since the selected release commit.' >&2
            exit 1
          fi
          export US_MARKET_PYTHON=python
          mkdir collector-artifact
          ops/us-market/package.sh "collector-artifact/us-market-$GITHUB_SHA.tar.gz"
          ops/us-market/install.sh verify "collector-artifact/us-market-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
          cp ops/us-market/install.sh collector-artifact/
          (cd collector-artifact && sha256sum -- *.tar.gz install.sh > SHA256SUMS)
          printf 'Collector artifact commit `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: us-market-collector-${{ github.sha }}
          path: collector-artifact
          if-no-files-found: error
  release:
    needs: collector-package
    if: github.ref == 'refs/heads/main' && inputs.mode != 'package'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: oracle-production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: vps-api/package-lock.json
      - run: npm ci --prefix vps-api
      - run: npm test
      - name: Record API release identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Oracle API candidate commit `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Send tracked API release to Oracle
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          : "${ORACLE_SSH_PRIVATE_KEY:?Add the Oracle deployment key to oracle-production}"
          : "${ORACLE_SSH_KNOWN_HOSTS:?Add the verified Oracle host key to oracle-production}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS
          release_files=(
            vps-api/server.mjs vps-api/market-cache.mjs vps-api/krx-backfill.mjs
            ':(glob)vps-api/*-provider.mjs' ':(glob)vps-api/*.test.mjs'
            vps-api/package.json vps-api/package-lock.json
            ':(exclude)vps-api/sec-provider.mjs'
          )
          git ls-files -z -- "${release_files[@]}" |
            tar --null --transform='s|^vps-api/||' -cf "$ssh_dir/release.tar" -T -
          # The installed receiver must support persistent DART cache provisioning.
          { printf '%s-dart-cache-v1\n' "$RELEASE_MODE"; cat "$ssh_dir/release.tar"; } |
            ssh -F /dev/null -T -i "$ssh_dir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              finance-deploy@168.107.15.106 finance-dashboard-release
